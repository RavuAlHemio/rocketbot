[package]
name = "rocketbotweb"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ciborium = { workspace = true }
form_urlencoded = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["http1", "http2", "server", "tokio"] }
indexmap = { workspace = true, features = ["serde"] }
once_cell = { workspace = true }
png = { workspace = true }
regex = { workspace = true }
rocketbot_bim_common = { path = "../rocketbot_bim_common" }
rocketbot_date_time = { path = "../rocketbot_date_time" }
rocketbot_interface = { path = "../rocketbot_interface" }
rocketbot_string = { path = "../rocketbot_string", features = ["regex", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-normalization = { workspace = true }
