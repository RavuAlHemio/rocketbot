[package]
name = "rocketbot_plugin_calc"
version = "0.1.0"
edition = "2021"

[features]
default = ["currency"]
currency = ["minidom", "reqwest"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
minidom = { workspace = true, optional = true }
num-bigint = { workspace = true, features = ["rand_0_10", "serde"] }
num-traits = { workspace = true }
once_cell = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
rocketbot_interface = { path = "../rocketbot_interface" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
toml = { workspace = true }
tracing = { workspace = true }
